<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hover</title>
    <style>
      button {
        padding: 10px 20px;
        font-size: 16px;
        background-color: #4caf50; /* Green */
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease-in 0.2s;
      }
      button:hover {
        background-color: blueviolet; /* Change to blueviolet on hover */
      }
    </style>
  </head>
  <body>
    <button>Hover me!</button>
  </body>
</html>
