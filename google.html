<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    div {
      text-align: center;
    }
    .google-logo {
      width: 250px;
      margin-bottom: 10px;
      margin-top: 250px;
    }
    .search-bar {
      width: 550px;
      padding-top: 12px;
      padding-bottom: 12px;
      padding-left: 20px;
      padding-right: 20px;
      font-size: 16px;
      border-radius: 30px;
      border: none;
      box-shadow: 0 1px 6px gray;
      color: gray;
      margin-bottom: 30px;
    }
    .search-button,
    .lucky-button {
      padding-top: 10px;
      padding-bottom: 10px;
      padding-left: 20px;
      padding-right: 20px;
      font-size: 15px;
      border: none;
      background-color: #eff1f3; /* Light gray */
      color: black;
      margin-right: 10px;
    }
  </style>
  <body>
    <div>
      <img src="google.png" alt="Google logo" class="google-logo" />
    </div>
    <div>
      <input
        type="text"
        placeholder="Search Google or type a URL"
        class="search-bar"
      />
    </div>
    <div>
      <button class="search-button">Google Search</button>
      <button class="lucky-button">I'm Feeling Lucky</button>
    </div>
  </body>
</html>
