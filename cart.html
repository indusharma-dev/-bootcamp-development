<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="console.log(`Cart quantity : ${cartQuantity}`)">
      Show quantity
    </button>
    <button
      onclick="cartQuantity = cartQuantity + 1 ;
    console.log(`+1 is clicked`)"
    >
      Add +1
    </button>
    <button
      onclick="cartQuantity = cartQuantity + 2 ;
    console.log(`+2 is clicked`)"
    >
      orange juice
    </button>
    <button
      onclick="cartQuantity = cartQuantity + 3 ;
    console.log(`+3 is clicked`)"
    >
      Add +3
    </button>
    <button onclick="cartQuantity = 0 ; console.log(`Reset is clicked`)"">Reset</button>
    <script>
      let cartQuantity = 0;
    </script>
  </body>
</html>
