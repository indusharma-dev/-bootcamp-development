<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .header {
      display: flex;
      background-color: rgb(120, 82, 178);
      color: white;
      padding: 15px;
      justify-content: space-between;
      align-items: center;
      width: 1000px;
    }
    .home {
      font-weight: bold;
    }
    .search-bar {
      width: 800px;
      border: none;
      height: 30px;
      border-radius: 15px;
      padding-left: 20px;
    }
    button {
      background-color: rgb(120, 82, 178);
      color: white;
      border: 1px solid white;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
  <body>
    <div class="header">
      <div class="home">Home</div>
      <input class="search-bar" type="text" placeholder="Search" />
      <button>Download</button>
    </div>
  </body>
</html>
