<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <input type="checkbox" id="checkbox" />
      <label for="checkbox">Keep me logged in</label>
      <br /><br />
      <a href="#">Forgot your password?</a>
      <br /><br />
      <input type="email" placeholder="Email" />
      <br /><br />
      <input type="password" placeholder="Password" />
      <br /><br />
      <input type="submit" value="Login" />
      <br /><br />
    </form>
    <h2>Sign Up</h2>
    <h2>It's free and anyone can join</h2>
    <form>
      <label for="firstname">First Name :</label>
      <input type="text" id="firstname" />
      <br /><br />
      <label for="lastname">Last Name :</label>
      <input type="text" id="lastname" />
      <br /><br />
      <label for="email">Email :</label>
      <input type="email" id="email" />
      <br /><br />
      <label for="password">New Password :</label>
      <input type="password" id="password" />
      <br /><br />
      <label for="gender">I am:</label>
      <select id="gender">
        <option value="" disabled selected>Select your options</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
      <br /><br />
      <label for="birthday">Birthday :</label>
      <input type="date" id="birthday" />
      <br /><br />
      <a href="#">Why Do I need to provide this?</a>
      <br /><br />
      <input type="submit" value="Sign Up" />
      <hr />
      <p><a href="#">Create a Page</a> for celebrity, brand or business</p>
    </form>
  </body>
</html>
